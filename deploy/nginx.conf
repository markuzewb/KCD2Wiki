# Replace wiki.example.ru and obtain an HTTPS certificate before enabling.
server {
    listen 80;
    server_name wiki.example.ru;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name wiki.example.ru;
    ssl_certificate /etc/letsencrypt/live/wiki.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.example.ru/privkey.pem;
    client_max_body_size 10m;  # admin JSON catalog uploads ~2 MiB
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_pass http://127.0.0.1:3082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }
}
